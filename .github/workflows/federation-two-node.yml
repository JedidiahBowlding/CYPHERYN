name: Federation Two Node

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  independence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.13"}
      - run: python -m pip install 'httpx>=0.28,<1'
      - name: Start independent nodes
        run: docker compose -f compose.federation.yaml up -d --build --wait
      - name: Exercise federation and local operation
        run: python scripts/test_federation_two_node.py
      - name: Capture failure diagnostics
        if: failure()
        run: docker compose -f compose.federation.yaml logs --no-color --tail=200
      - name: Remove test environment
        if: always()
        run: docker compose -f compose.federation.yaml down -v
