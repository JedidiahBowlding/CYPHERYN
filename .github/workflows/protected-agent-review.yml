name: Protected Agent Review

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres-authority-and-migrations:
    name: PostgreSQL authority and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agent_security_test
          POSTGRES_USER: agent_security_test
          POSTGRES_PASSWORD: agent_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_security_test -d agent_security_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PLATFORM_DATABASE_URL: postgresql+psycopg://agent_security_test:agent_security_test@127.0.0.1:5432/agent_security_test
      AGENT_SECURITY_TEST_DATABASE_URL: postgresql+psycopg://agent_security_test:agent_security_test@127.0.0.1:5432/agent_security_test
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # This is the immutable pre-Alembic production schema that the first
      # protected-agent migration upgrades. A moving PR base eventually contains
      # the new tables itself and produces a false DuplicateTable failure.
      - name: Check out certified pre-Alembic baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 0570c28c6ef2d93f50fd53bb1b3b79e8684c7add
          path: migration-baseline
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: platform/api/pyproject.toml
      - name: Install candidate API dependencies
        working-directory: platform/api
        run: python -m pip install -e '.[dev]'
      - name: Exercise upgrade, downgrade, and re-upgrade
        working-directory: platform/api
        run: |
          python - <<'PY'
          import os
          import sys

          baseline = os.path.join(os.environ["GITHUB_WORKSPACE"], "migration-baseline", "platform", "api", "src")
          sys.path.insert(0, baseline)
          from intel_platform.database import Base, engine
          import intel_platform.models  # noqa: F401

          Base.metadata.create_all(engine)
          PY
          alembic stamp 20260930_egress_baseline
          alembic upgrade head
          alembic current | tee migration-upgrade.txt
          alembic downgrade 20260930_egress_baseline
          alembic upgrade head
          alembic current | tee migration-reupgrade.txt
      - name: Exercise clean development initialization
        working-directory: platform/api
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["PLATFORM_DATABASE_URL"])
          with engine.begin() as connection:
              connection.execute(text("DROP SCHEMA public CASCADE"))
              connection.execute(text("CREATE SCHEMA public"))
          engine.dispose()
          PY
          python - <<'PY'
          from intel_platform.database import Base, engine
          import intel_platform.models  # noqa: F401

          Base.metadata.create_all(engine)
          PY
          alembic stamp head
          alembic current | tee migration-clean-development.txt
      - name: Exercise PostgreSQL single-use authority and concurrency
        working-directory: platform/api
        run: python -m pytest tests/test_agent_security_postgres.py -q --junitxml=agent-security-postgres.xml
      - name: Upload PostgreSQL and migration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: protected-agent-postgres-evidence
          path: |
            platform/api/agent-security-postgres.xml
            platform/api/migration-*.txt
          if-no-files-found: warn
          retention-days: 14
