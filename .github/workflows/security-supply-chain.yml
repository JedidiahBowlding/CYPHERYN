name: Security and supply chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: platform/api/pyproject.toml
      - name: Audit Python dependencies
        working-directory: platform/api
        run: |
          python -m pip install -e ".[dev]" pip-audit
          python -m pip_audit . --strict
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - name: Audit locked frontend dependencies
        working-directory: platform/frontend
        run: |
          npm ci
          npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-and-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate non-secret CI environment
        run: python scripts/setup.py --check
      - name: Build core images
        run: docker compose build api worker frontend taxii scanner-orchestrator
      - name: Scan shipped images
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: signaltrace-api:latest
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
          ignore-unfixed: true
          scanners: vuln
      - name: Generate API SBOM
        uses: anchore/sbom-action@v0.24.2
        with:
          image: signaltrace-api:latest
          artifact-name: signaltrace-api.spdx.json
      - name: Scan worker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: signaltrace-worker:latest
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
          ignore-unfixed: true
          scanners: vuln
      - name: Generate worker SBOM
        uses: anchore/sbom-action@v0.24.2
        with:
          image: signaltrace-worker:latest
          artifact-name: signaltrace-worker.spdx.json
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: signaltrace-frontend:latest
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
          ignore-unfixed: true
          scanners: vuln
      - name: Generate frontend SBOM
        uses: anchore/sbom-action@v0.24.2
        with:
          image: signaltrace-frontend:latest
          artifact-name: signaltrace-frontend.spdx.json
      - name: Scan TAXII image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: signaltrace-taxii:latest
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
          ignore-unfixed: true
          scanners: vuln
      - name: Generate TAXII SBOM
        uses: anchore/sbom-action@v0.24.2
        with:
          image: signaltrace-taxii:latest
          artifact-name: signaltrace-taxii.spdx.json
      - name: Scan scanner orchestrator image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: signaltrace-scanner-orchestrator:latest
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
          ignore-unfixed: true
          scanners: vuln
      - name: Generate scanner orchestrator SBOM
        uses: anchore/sbom-action@v0.24.2
        with:
          image: signaltrace-scanner-orchestrator:latest
          artifact-name: signaltrace-scanner-orchestrator.spdx.json
