name: CYPHERYN cross-platform

on:
  push:
    paths:
      - "platform/**"
      - "scripts/**"
      - "compose.yaml"
      - ".env.example"
      - ".github/workflows/cypheryn-cross-platform.yml"
  pull_request:

permissions:
  contents: read

jobs:
  utilities-api:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: platform/api/pyproject.toml
      - name: Compile cross-platform utilities
        run: python -m py_compile scripts/setup.py scripts/doctor.py scripts/reset_dev.py platform/taxii/server.py
      - name: Install API test dependencies
        working-directory: platform/api
        run: python -m pip install -e ".[dev]"
      - name: Install OCR dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - name: Test API
        working-directory: platform/api
        run: python -m pytest --junitxml=test-results.xml --cov=intel_platform --cov-fail-under=60 --cov-report=json:coverage.json
      - name: Upload API test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-test-evidence-${{ matrix.os }}
          path: |
            platform/api/test-results.xml
            platform/api/coverage.json
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce critical security coverage
        run: python scripts/check_critical_coverage.py platform/api/coverage.json
      - name: Lint API
        working-directory: platform/api
        run: python -m ruff check src tests

  frontend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: platform/frontend
        run: npm ci
      - name: Lint
        working-directory: platform/frontend
        run: npm run lint
      - name: Type check
        working-directory: platform/frontend
        run: npm run typecheck
      - name: Build and test rendered routes
        working-directory: platform/frontend
        run: npm test

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Generate CI configuration and validate Compose
        run: python scripts/setup.py --check
      - name: Build core images
        run: docker compose build api worker frontend taxii scanner-orchestrator
      - name: Start and verify core services
        run: |
          docker compose up -d --wait --wait-timeout 180
          python scripts/doctor.py
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down -v
