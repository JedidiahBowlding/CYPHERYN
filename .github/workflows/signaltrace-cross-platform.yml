name: SignalTrace cross-platform

on:
  push:
    paths:
      - "platform/**"
      - "scripts/**"
      - "compose.yaml"
      - ".env.example"
      - ".github/workflows/signaltrace-cross-platform.yml"
  pull_request:

jobs:
  utilities-api:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: platform/api/pyproject.toml
      - name: Compile cross-platform utilities
        run: python -m py_compile scripts/setup.py scripts/doctor.py scripts/reset_dev.py platform/taxii/server.py
      - name: Install API test dependencies
        working-directory: platform/api
        run: python -m pip install -e ".[dev]"
      - name: Test API
        working-directory: platform/api
        run: python -m pytest --cov=intel_platform --cov-fail-under=50 --cov-report=json:coverage.json
      - name: Enforce critical security coverage
        run: python scripts/check_critical_coverage.py platform/api/coverage.json
      - name: Lint API
        working-directory: platform/api
        run: python -m ruff check src tests

  frontend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: platform/frontend
        run: npm ci
      - name: Lint
        working-directory: platform/frontend
        run: npm run lint
      - name: Type check
        working-directory: platform/frontend
        run: npm run typecheck
      - name: Build and test rendered routes
        working-directory: platform/frontend
        run: npm test

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generate CI configuration and validate Compose
        run: python scripts/setup.py --check
      - name: Build core images
        run: docker compose build api worker frontend taxii
      - name: Start and verify core services
        run: |
          docker compose up -d --wait --wait-timeout 180
          python scripts/doctor.py
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down -v
