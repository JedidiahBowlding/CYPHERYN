name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  verify-build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}
      - name: Verify tag matches release metadata
        run: |
          expected_tag="v$(awk '{print $2}' VERSION)"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match VERSION ($expected_tag)." >&2
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: platform/api/pyproject.toml}
      - name: Test, lint, and audit API
        working-directory: platform/api
        run: |
          python -m pip install -e ".[dev]" pip-audit
          python -m pytest --cov=intel_platform --cov-fail-under=60 --cov-report=json:coverage.json
          python ../../scripts/check_critical_coverage.py coverage.json
          python -m ruff check src tests
          python -m pip_audit . --strict
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: "22.14.0", cache: npm, cache-dependency-path: platform/frontend/package-lock.json}
      - name: Test, build, and audit frontend
        working-directory: platform/frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          # Production dependencies ship with the frontend image. Development-only
          # tooling is covered by CodeQL and container scanning; npm currently has
          # no patched release for GHSA-vfj7-8cjw-p6xm in the braces toolchain.
          npm audit --omit=dev --audit-level=high
      - name: Build shipped images
        run: |
          python scripts/setup.py --check
          docker compose build api worker frontend taxii scanner-orchestrator egress-proxy protected-agent-pilot
      - name: Scan shipped images
        run: |
          for image in cypheryn-api:latest cypheryn-worker:latest cypheryn-frontend:latest cypheryn-taxii:latest cypheryn-scanner-orchestrator:latest cypheryn-egress-proxy:latest cypheryn-protected-agent-pilot:latest; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD:/workspace" aquasec/trivy:0.68.2 image \
              --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /workspace/.trivyignore \
              --exit-code 1 "$image"
          done
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable release images
        id: publish-images
        env:
          REGISTRY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$REGISTRY_OWNER" | tr '[:upper:]' '[:lower:]')"
          : > dist-image-digests.txt
          for component in api worker frontend taxii scanner-orchestrator egress-proxy protected-agent-pilot; do
            local_image="cypheryn-${component}:latest"
            repository="ghcr.io/${owner}/cypheryn-${component}"
            version_ref="${repository}:${GITHUB_REF_NAME}"
            commit_ref="${repository}:sha-${GITHUB_SHA}"
            docker tag "$local_image" "$version_ref"
            docker tag "$local_image" "$commit_ref"
            docker push "$version_ref"
            docker push "$commit_ref"
            digest_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "$version_ref")"
            digest="${digest_ref##*@}"
            printf '%s=%s@%s\n' "$component" "$repository" "$digest" | tee -a dist-image-digests.txt
            printf '%s_digest=%s\n' "${component//-/_}" "$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Attest API image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/jedidiahbowlding/cypheryn-api
          subject-digest: ${{ steps.publish-images.outputs.api_digest }}
          push-to-registry: true
      - name: Attest worker image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/jedidiahbowlding/cypheryn-worker
          subject-digest: ${{ steps.publish-images.outputs.worker_digest }}
          push-to-registry: true
      - name: Attest frontend image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/jedidiahbowlding/cypheryn-frontend
          subject-digest: ${{ steps.publish-images.outputs.frontend_digest }}
          push-to-registry: true
      - name: Attest TAXII image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/jedidiahbowlding/cypheryn-taxii
          subject-digest: ${{ steps.publish-images.outputs.taxii_digest }}
          push-to-registry: true
      - name: Attest scanner orchestrator image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/jedidiahbowlding/cypheryn-scanner-orchestrator
          subject-digest: ${{ steps.publish-images.outputs.scanner_orchestrator_digest }}
          push-to-registry: true
      - name: Attest trusted egress proxy image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/jedidiahbowlding/cypheryn-egress-proxy
          subject-digest: ${{ steps.publish-images.outputs.egress_proxy_digest }}
          push-to-registry: true
      - name: Attest protected pilot image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/jedidiahbowlding/cypheryn-protected-agent-pilot
          subject-digest: ${{ steps.publish-images.outputs.protected_agent_pilot_digest }}
          push-to-registry: true
      - name: Prepare release artifacts
        run: |
          mkdir -p dist
          mv dist-image-digests.txt dist/image-digests.txt
      - name: Generate SBOMs
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: cypheryn-api:latest
          output-file: dist/cypheryn-api.spdx.json
      - name: Generate frontend SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: cypheryn-frontend:latest
          output-file: dist/cypheryn-frontend.spdx.json
      - name: Generate worker SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: cypheryn-worker:latest
          output-file: dist/cypheryn-worker.spdx.json
      - name: Generate TAXII SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: cypheryn-taxii:latest
          output-file: dist/cypheryn-taxii.spdx.json
      - name: Generate scanner orchestrator SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: cypheryn-scanner-orchestrator:latest
          output-file: dist/cypheryn-scanner-orchestrator.spdx.json
      - name: Generate trusted egress proxy SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: cypheryn-egress-proxy:latest
          output-file: dist/cypheryn-egress-proxy.spdx.json
      - name: Generate protected pilot agent SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: cypheryn-protected-agent-pilot:latest
          output-file: dist/cypheryn-protected-agent-pilot.spdx.json
      - name: Package source and checksums
        run: |
          git archive --format=tar.gz --prefix="CYPHERYN-${GITHUB_REF_NAME}/" \
            -o "dist/CYPHERYN-${GITHUB_REF_NAME}.tar.gz" "$GITHUB_SHA"
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Attest source artifact
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/CYPHERYN-*.tar.gz
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "CYPHERYN $GITHUB_REF_NAME"
