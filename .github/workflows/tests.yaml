name: Tests

on:
  push:
    branches: main
  pull_request:
    branches: main

permissions:
  contents: read

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.10"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r test/requirements.txt
      - name: Lint with flake8
        run: |
          # The inherited tree predates the platform's Ruff policy. Gate fatal
          # Python errors here; platform code is linted strictly by Ruff below.
          flake8 sf.py spiderfoot modules test --select=E9,F63,F7,F82 --show-source --statistics
      - name: Test with pytest
        if: runner.os != 'Windows'
        run: |
          python -m pytest -n auto --dist loadfile test/unit test/integration --ignore=test/integration/modules/ --durations=5 --cov=spiderfoot --cov=modules --cov-report term
      - name: Validate inherited Python on Windows
        if: runner.os == 'Windows'
        run: python -m compileall -q sf.py spiderfoot modules
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        if: runner.os != 'Windows'
        with:
          fail_ci_if_error: false
          verbose: true
