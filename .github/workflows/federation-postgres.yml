name: Federation PostgreSQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: federation_test
          POSTGRES_USER: federation_test
          POSTGRES_PASSWORD: federation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U federation_test -d federation_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: platform/api/pyproject.toml
      - name: Install API dependencies
        working-directory: platform/api
        run: python -m pip install -e '.[dev]'
      - name: Exercise PostgreSQL federation races
        working-directory: platform/api
        env:
          FEDERATION_TEST_DATABASE_URL: postgresql+psycopg://federation_test:federation_test@127.0.0.1:5432/federation_test
        run: python -m pytest tests/test_federation_postgres.py -q --junitxml=federation-postgres.xml
      - name: Upload PostgreSQL federation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: federation-postgres-results
          path: platform/api/federation-postgres.xml
          if-no-files-found: warn
          retention-days: 14
