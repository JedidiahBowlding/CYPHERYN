# Install as an Ollama systemd drop-in only on the private Docker host.
# 172.18.0.1 is the host-side address of CYPHERYN's private Docker bridge in
# the documented production topology; adjust it if that bridge is re-addressed.
[Service]
Environment="OLLAMA_HOST=172.18.0.1:11434"
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_KEEP_ALIVE=5m"
