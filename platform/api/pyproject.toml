[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "signaltrace-api"
version = "0.1.0"
description = "SignalTrace evidence-grounded defensive intelligence API and worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.6,<3",
  "PyJWT[crypto]>=2.10,<3",
  "cryptography>=50.0.0,<51",
  "dnspython>=2.7,<3",
  "certifi>=2024.8.30",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "reportlab>=4.2,<5",
  "PyYAML>=6.0,<7",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9.0.3,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/intel_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
